# PR Title Linter
#
# Enforces conventional-commit format on PR titles via the shared
# pr-title-lint reusable. Squash-merge is the only strategy used here, so
# the PR title becomes the single commit subject on main — and GoReleaser
# parses those subjects to group release notes. A non-conventional title
# silently lands in "Miscellaneous" and hides the change from users.
#
# pull_request_target is required here (not pull_request): this repo accepts
# cross-org fork PRs, and the lint needs GITHUB_TOKEN — which pull_request
# withholds from fork PRs. Verified safe: no checkout step, no secrets beyond
# GITHUB_TOKEN (pull-requests: read only), PR title consumed as event-payload
# data by the action rather than executed as code. See shared-workflows#1401.
#
# The reusable has no built-in `pull_request`/`pull_request_target` trigger —
# this caller's `on:` block is authoritative.

name: PR Title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    uses: blavity/shared-workflows/.github/workflows/pr-title-lint.yaml@ac2bb2d18bd17d2cd866104357d86cb82cb178f9 # pr-title-lint-v1
    with:
      # require_scope: false and the default types set (build, chore, ci,
      # docs, feat, fix, perf, refactor, revert, style, test) already match
      # this repo's prior local config — no types: override needed.
      require_scope: false
      subject_pattern: ^[A-Za-z].+$
      subject_pattern_error: |
        The subject of the PR title must start with a letter
        (no leading symbols, no empty subject).
